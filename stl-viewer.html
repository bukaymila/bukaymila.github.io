<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>STL 3D Explorer | By Alim Yakub (RP)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥶</text></svg>">
    <link rel="stylesheet" href="assets\styles\theme.css">
    <style>
        body.no-nav-pad {
            overflow: hidden;
            height: 100vh;
        }

        /* Make the navbar translucent over the 3D canvas */
        .topnav {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @media (prefers-color-scheme: dark) {
            .topnav { background: rgba(22, 22, 21, 0.85); }
        }

        #info {
            position: absolute;
            top: calc(var(--nav-height) + 16px);
            left: 20px;
            background: var(--surface);
            color: var(--ink);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            pointer-events: none;
            z-index: 10;
            font-size: 0.85rem;
            border-left: 4px solid var(--green);
            font-family: 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            box-shadow: var(--shadow-md);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        #info strong { color: var(--green-deep); }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--surface);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        #controls button {
            background: var(--green);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        #controls button:hover {
            background: var(--green-hover);
            transform: translateY(-1px);
        }

        .file-label {
            background: var(--accent);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
        }
        .file-label:hover { background: var(--accent-hover); }

        input[type="file"] { display: none; }

        .measure-box {
            background: var(--bg-alt);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-family: 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            font-size: 0.8rem;
            color: var(--ink);
            font-weight: 600;
            border: 1px solid var(--border-strong);
        }

        .status {
            background: var(--bg-alt);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            color: var(--ink-muted);
            border: 1px solid var(--border);
        }

        .instruction {
            position: absolute;
            bottom: 100px;
            right: 20px;
            background: var(--surface);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            color: var(--ink-muted);
            font-family: 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            pointer-events: none;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--danger-soft);
            color: var(--danger);
            padding: 15px 25px;
            border-radius: var(--radius-md);
            z-index: 100;
            text-align: center;
            font-family: 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            border: 1px solid var(--danger);
            pointer-events: none;
            animation: fadeOut 3s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 700px) {
            #controls { flex-direction: column; align-items: stretch; }
            #controls button, .file-label { text-align: center; justify-content: center; }
            .measure-box, .status { text-align: center; }
            #info { font-size: 0.75rem; padding: 8px 12px; }
        }
    </style>
</head>
<body class="no-nav-pad">
    <div id="info">
        <strong>STL Explorer</strong> by Alim Yakub (RP)
    </div>

    <div id="controls">
        <label class="file-label">
            Open STL File
            <input type="file" id="stlFileInput" accept=".stl,.STL">
        </label>
        <button id="resetViewBtn">Center &amp; Reset View</button>
        <button id="toggleGridBtn">Toggle Grid</button>
        <div class="measure-box" id="sizeDisplay">
            Size: <span id="dimensions">--</span>
        </div>
        <div class="status" id="statusMsg">
            Ready — Load an STL file
        </div>
    </div>
    <div class="instruction">
        Drag to rotate | Right-drag to pan | Scroll to zoom
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        // Detect dark mode for 3D scene background
        function isDark() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        function sceneBackground() {
            return isDark() ? 0x161615 : 0xf0f2ec;
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(sceneBackground());
        scene.fog = new THREE.FogExp2(sceneBackground(), 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);
        camera.position.set(5, 4, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.screenSpacePanning = false;
        controls.maxPolarAngle = Math.PI / 1.6;

        let currentGridHelper = null;
        let currentAxesHelper = null;
        let currentShadowPlane = null;

        function gridColors() {
            return isDark()
                ? { minor: 0x4a5a3a, major: 0x6a8a5a, axesOpacity: 0.3 }
                : { minor: 0x8fa87a, major: 0x6FB01E, axesOpacity: 0.5 };
        }

        function createDynamicGrid(modelSize) {
            if (currentGridHelper) scene.remove(currentGridHelper);
            if (currentAxesHelper) scene.remove(currentAxesHelper);
            if (currentShadowPlane) scene.remove(currentShadowPlane);

            const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
            const gridSize = Math.max(5, Math.ceil(maxDim * 1.5));
            const divisions = Math.min(40, Math.max(10, Math.floor(gridSize / 0.8)));
            const colors = gridColors();

            currentGridHelper = new THREE.GridHelper(gridSize, divisions, colors.major, colors.minor);
            currentGridHelper.position.y = -maxDim * 0.15;
            currentGridHelper.material.transparent = true;
            currentGridHelper.material.opacity = isDark() ? 0.6 : 0.4;
            scene.add(currentGridHelper);

            const majorGrid = new THREE.GridHelper(gridSize, Math.floor(gridSize / 1), colors.major, colors.minor);
            majorGrid.position.y = -maxDim * 0.15 - 0.02;
            majorGrid.material.transparent = true;
            majorGrid.material.opacity = 0.25;
            scene.add(majorGrid);
            currentGridHelper.userData = { majorGrid };

            currentAxesHelper = new THREE.AxesHelper(maxDim * 0.8);
            currentAxesHelper.material.transparent = true;
            currentAxesHelper.material.opacity = colors.axesOpacity;
            scene.add(currentAxesHelper);

            currentShadowPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(gridSize * 1.2, gridSize * 1.2),
                new THREE.ShadowMaterial({ opacity: 0.25, color: 0x000000, transparent: true, side: THREE.DoubleSide })
            );
            currentShadowPlane.rotation.x = -Math.PI / 2;
            currentShadowPlane.position.y = -maxDim * 0.15 - 0.05;
            currentShadowPlane.receiveShadow = true;
            scene.add(currentShadowPlane);

            return { gridSize, divisions };
        }

        const ambientLight = new THREE.AmbientLight(0x4a5a6a, isDark() ? 0.7 : 0.9);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff0e0, 1.3);
        mainLight.position.set(5, 8, 3);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.1;
        mainLight.shadow.camera.far = 500;
        mainLight.shadow.camera.left = -20;
        mainLight.shadow.camera.right = 20;
        mainLight.shadow.camera.top = 20;
        mainLight.shadow.camera.bottom = -20;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0xaa8866, 0.55);
        fillLight.position.set(0, -3, 0);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0x88aaff, 0.65);
        rimLight.position.set(-2, 3, -4);
        scene.add(rimLight);

        const frontFill = new THREE.PointLight(0xccddff, 0.5);
        frontFill.position.set(2, 1, 3);
        scene.add(frontFill);

        const sideLight = new THREE.DirectionalLight(0xffddbb, 0.6);
        sideLight.position.set(-3, 2, 2);
        scene.add(sideLight);

        const globalFill = new THREE.HemisphereLight(0x88aacc, 0xaa8866, 0.55);
        scene.add(globalFill);

        const backFill = new THREE.PointLight(0x6699cc, 0.4);
        backFill.position.set(0, 2, -5);
        scene.add(backFill);

        let currentModel = null;
        let gridVisible = true;

        function updateModelAndAdaptScene(modelMesh) {
            if (!modelMesh) {
                document.getElementById('dimensions').innerHTML = '--';
                document.getElementById('statusMsg').innerHTML = 'No model loaded';
                return;
            }

            const bbox = new THREE.Box3().setFromObject(modelMesh);
            const size = bbox.getSize(new THREE.Vector3());
            const center = bbox.getCenter(new THREE.Vector3());

            const x = size.x.toFixed(2);
            const y = size.y.toFixed(2);
            const z = size.z.toFixed(2);
            const maxDim = Math.max(size.x, size.y, size.z).toFixed(2);

            document.getElementById('dimensions').innerHTML =
                x + ' × ' + y + ' × ' + z + ' mm <span style="color: var(--green-deep);">(max: ' + maxDim + ' mm)</span>';
            document.getElementById('statusMsg').innerHTML =
                'Model loaded | ' + size.x.toFixed(1) + ' × ' + size.y.toFixed(1) + ' × ' + size.z.toFixed(1) + ' mm';

            createDynamicGrid(size);

            const distance = Math.max(maxDim * 1.2, 3);
            const cameraDistance = Math.min(distance, 50);

            camera.position.set(
                center.x + cameraDistance * 0.8,
                center.y + cameraDistance * 0.5,
                center.z + cameraDistance
            );
            controls.target.copy(center);
            controls.update();

            const intensityScale = Math.min(1.6, Math.max(0.9, maxDim / 18));
            mainLight.intensity = 1.2 * intensityScale;
            fillLight.intensity = 0.55 * intensityScale;
            rimLight.intensity = 0.65 * intensityScale;
            frontFill.intensity = 0.5 * intensityScale;
            backFill.intensity = 0.45 * intensityScale;

            if (maxDim > 30) {
                mainLight.shadow.camera.left = -maxDim;
                mainLight.shadow.camera.right = maxDim;
                mainLight.shadow.camera.top = maxDim;
                mainLight.shadow.camera.bottom = -maxDim;
                mainLight.shadow.camera.updateProjectionMatrix();
            }
        }

        const loader = new STLLoader();

        function loadSTLFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const buffer = event.target.result;
                    try {
                        const geometry = loader.parse(buffer);
                        geometry.computeVertexNormals();

                        const material = new THREE.MeshStandardMaterial({
                            color: 0x6FB01E,
                            roughness: 0.35,
                            metalness: 0.4,
                            emissive: isDark() ? 0x1a2a08 : 0x0a1a02,
                            flatShading: false,
                            side: THREE.DoubleSide
                        });

                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;

                        const bbox = new THREE.Box3().setFromObject(mesh);
                        const center = bbox.getCenter(new THREE.Vector3());
                        const minY = bbox.min.y;
                        const offsetY = -minY + 0.1;
                        mesh.position.set(-center.x, -center.y + offsetY, -center.z);

                        resolve(mesh);
                    } catch (err) {
                        reject(new Error('STL parsing failed: ' + err.message));
                    }
                };
                reader.onerror = () => reject(new Error('File read error'));
                reader.readAsArrayBuffer(file);
            });
        }

        const fileInput = document.getElementById('stlFileInput');
        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith('.stl')) {
                document.getElementById('statusMsg').innerHTML = 'Please select a .stl file';
                return;
            }

            document.getElementById('statusMsg').innerHTML = 'Loading STL file...';
            document.getElementById('dimensions').innerHTML = 'processing...';

            try {
                const mesh = await loadSTLFile(file);
                if (currentModel) {
                    scene.remove(currentModel);
                    if (currentModel.geometry) currentModel.geometry.dispose();
                    if (currentModel.material) currentModel.material.dispose();
                }
                scene.add(mesh);
                currentModel = mesh;
                updateModelAndAdaptScene(mesh);
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('statusMsg').innerHTML = 'Error: ' + error.message;
                document.getElementById('dimensions').innerHTML = 'failed';

                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.innerHTML = 'Failed to load STL<br><span style="font-size:0.72rem;">' + error.message + '</span>';
                document.body.appendChild(errorDiv);
                setTimeout(() => errorDiv.remove(), 3000);
            }
        });

        document.getElementById('resetViewBtn').addEventListener('click', () => {
            if (currentModel) {
                const bbox = new THREE.Box3().setFromObject(currentModel);
                const center = bbox.getCenter(new THREE.Vector3());
                const size = bbox.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const distance = Math.min(Math.max(maxDim * 1.2, 3), 50);
                camera.position.set(
                    center.x + distance * 0.8,
                    center.y + distance * 0.5,
                    center.z + distance
                );
                controls.target.copy(center);
                controls.update();
            } else {
                camera.position.set(5, 4, 7);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        document.getElementById('toggleGridBtn').addEventListener('click', () => {
            gridVisible = !gridVisible;
            if (currentGridHelper) currentGridHelper.visible = gridVisible;
            if (currentAxesHelper) currentAxesHelper.visible = gridVisible;
            if (currentShadowPlane) currentShadowPlane.visible = gridVisible;
            if (currentGridHelper?.userData?.majorGrid) currentGridHelper.userData.majorGrid.visible = gridVisible;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const dropZone = document.body;

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.opacity = '0.95';
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.opacity = '1';
        });
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.style.opacity = '1';
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.toLowerCase().endsWith('.stl')) {
                const file = files[0];
                document.getElementById('statusMsg').innerHTML = 'Loading dropped STL...';
                try {
                    const mesh = await loadSTLFile(file);
                    if (currentModel) {
                        scene.remove(currentModel);
                        if (currentModel.geometry) currentModel.geometry.dispose();
                        if (currentModel.material) currentModel.material.dispose();
                    }
                    scene.add(mesh);
                    currentModel = mesh;
                    updateModelAndAdaptScene(mesh);
                } catch (err) {
                    document.getElementById('statusMsg').innerHTML = 'Drop error: ' + err.message;
                }
            } else {
                document.getElementById('statusMsg').innerHTML = 'Please drop a valid .stl file';
            }
        });

        // Re-theme scene when OS dark mode changes
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                const bg = sceneBackground();
                scene.background = new THREE.Color(bg);
                scene.fog = new THREE.FogExp2(bg, 0.002);
                if (currentModel) {
                    const bbox = new THREE.Box3().setFromObject(currentModel);
                    createDynamicGrid(bbox.getSize(new THREE.Vector3()));
                } else {
                    createDynamicGrid({ x: 5, y: 5, z: 5 });
                }
            });
        }

        const originMarker = new THREE.Mesh(
            new THREE.SphereGeometry(0.05, 6, 6),
            new THREE.MeshStandardMaterial({
                color: 0x6FB01E,
                emissive: 0x2a4a08,
                transparent: true,
                opacity: 0.6
            })
        );
        scene.add(originMarker);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        createDynamicGrid({ x: 5, y: 5, z: 5 });
    </script>

    <script src="assets\scripts\navbar.js" defer></script>
</body>
</html>
